[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ins-kerberos-lab"
version = "0.1.0"
description = "Educational Kerberos-style authentication and security experiments"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["Flask>=3,<4", "cryptography>=44"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ins-kdc = "kerberos_lab.kdc.app:main"
ins-resource = "kerberos_lab.resource_server.app:main"
ins-health = "kerberos_lab.client.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
